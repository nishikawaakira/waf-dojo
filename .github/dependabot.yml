version: 2
updates:
  # Go モジュールの依存関係
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # minor / patch はまとめて 1 PR にする。
      # major はこのグループに該当しないので個別 PR になる（大きな変更は個別にレビュー）。
      # セキュリティ更新は applies-to を付けていないため、常に個別・即時で出る。
      go-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions の依存関係（ワークフローで使うアクション）
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
